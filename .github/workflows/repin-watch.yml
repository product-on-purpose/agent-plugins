name: repin-watch

# Notices when a listed member has published a release this registry is not pinned to, prepares the
# re-pin on a branch, and opens an issue asking for the call.
#
# THE PROBLEM THIS EXISTS FOR. `agent-skills-toolkit` tagged and GitHub-released v1.16.2 and v1.16.3
# on 2026-08-25. Three days later this registry was still pinned to v1.16.1, and npm still served
# 1.16.1 too, so two fixes written for consumers of that toolkit's reusable Action had reached those
# consumers by neither route. Nothing was broken. Nobody had looked. `validate-registry` would not
# have caught it and should not have: it asks whether a pin is VALID, and a pin to an older release is
# perfectly valid. "Valid" and "current" are different questions. This asks the second one.
#
# WHY AN ISSUE RATHER THAN A PULL REQUEST, and this is a refusal rather than a workaround. The first
# real run of this workflow pushed its branch cleanly and then failed with:
#
#   pull request create failed: GraphQL: GitHub Actions is not permitted to create or approve
#   pull requests (createPullRequest)
#
# That is the repository setting `can_approve_pull_request_reviews`, and GitHub bundles CREATE and
# APPROVE into that one toggle. Enabling it would let any workflow in this repository approve a pull
# request. `main` currently requires no reviews, so the approve half is inert TODAY, and that is
# exactly what makes enabling it the wrong trade: it would become a self-approval hole on the day
# someone adds a review requirement, silently, with nothing connecting the two changes. A latent hole
# is worse than a visible extra click. So the branch is pushed, which needs only `contents: write`,
# and the decision arrives as an issue carrying the checklist and a one-click compare link. That is
# the same shape the family already uses for `vendor-watch`, which opens an issue and never edits
# anything.
#
# WHAT IT DOES NOT DO. It never merges, and it never opens the pull request. Deciding that a new
# release SHOULD be carried is a judgement, because a member can ship a release this registry
# deliberately skips. Only the noticing is mechanical, and only the noticing is automated here.
#
# ONE MEMBER PER RUN, deliberately. Every historical re-pin in CHANGELOG.md moves exactly one entry
# and says "no other member entry moves", which keeps a bisect and a revert meaningful. If two members
# are behind, the next run picks up the second.
#
# Per the repo convention, this workflow holds no logic of its own: every decision lives in
# scripts/check-registry-pins.mjs, which is the same command a maintainer runs locally.

on:
  schedule:
    # Daily. A member can release at any hour, and the cost of noticing a day late is exactly the
    # failure this exists to prevent.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repin-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Detection only. Exit 1 means at least one member is behind, which is the reason this job
      # exists rather than a failure. Exit 2 means a member could NOT be read (rate limit, outage),
      # which is a refusal: a check that cannot see is not a check that found nothing, so the job
      # fails loudly instead of reporting a clean registry.
      - name: Survey every pinned member against its latest release
        id: survey
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          node scripts/check-registry-pins.mjs
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "::error::a member could not be read; this run proves nothing about it"
            exit 1
          fi
          node scripts/check-registry-pins.mjs --json > survey.json

      - name: Pick the first member that is behind
        id: pick
        if: ${{ steps.survey.outputs.code == '1' }}
        run: |
          NAME="$(node -e '
            const s = require("./survey.json");
            const first = s.rows.find(r => r.status === "behind");
            process.stdout.write(first ? first.name : "");
          ')"
          if [ -z "$NAME" ]; then
            echo "::error::survey reported drift but named no member"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "branch=repin/$NAME" >> "$GITHUB_OUTPUT"

      # An open issue for this member already carries the decision to the maintainer. Opening a second
      # one every morning would be noise, and noise is how a real signal gets ignored.
      - name: Skip if a re-pin issue for this member is already open
        id: existing
        if: ${{ steps.pick.outputs.name != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pick.outputs.branch }}
        run: |
          COUNT="$(gh issue list --state open --search "$BRANCH in:body" --json number --jq 'length')"
          echo "open=$COUNT" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" != "0" ]; then
            echo "A re-pin issue for $BRANCH is already open; nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Apply the re-pin
        id: apply
        if: ${{ steps.pick.outputs.name != '' && steps.existing.outputs.open == '0' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NAME: ${{ steps.pick.outputs.name }}
        run: |
          node scripts/check-registry-pins.mjs --apply "$NAME" > applied.json
          cat applied.json
          {
            echo "from_version=$(node -p 'require("./applied.json").fromVersion')"
            echo "to_version=$(node -p 'require("./applied.json").toVersion')"
            echo "to_sha=$(node -p 'require("./applied.json").toSha')"
            echo "to_registry=$(node -p 'require("./applied.json").toRegistry')"
          } >> "$GITHUB_OUTPUT"

      # The load-bearing step. Nothing is pushed and no issue is raised unless the edited registry
      # validates, so a maintainer is never asked to review a change that was never checked.
      - name: Validate the edited registry before anything leaves this job
        if: ${{ steps.apply.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/validate-registry.mjs

      - name: Push the branch and open an issue carrying the checklist
        if: ${{ steps.apply.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.pick.outputs.name }}
          BRANCH: ${{ steps.pick.outputs.branch }}
          FROM_V: ${{ steps.apply.outputs.from_version }}
          TO_V: ${{ steps.apply.outputs.to_version }}
          TO_SHA: ${{ steps.apply.outputs.to_sha }}
          TO_REG: ${{ steps.apply.outputs.to_registry }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add .claude-plugin/marketplace.json CHANGELOG.md
          git commit -m "registry(${TO_REG}): re-pin ${NAME} to v${TO_V}" \
            -m "Noticed by repin-watch: ${NAME} published v${TO_V} while this registry was still pinned to v${FROM_V}. strict: true preserved; no other member entry moves." \
            -m "validate-registry.mjs ran green against this exact tree inside the job, before the branch was pushed."
          git push -u origin "$BRANCH" --force-with-lease
          COMPARE="https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
          {
            printf '`%s` published **v%s** while this registry is pinned to **v%s**.\n\n' "$NAME" "$TO_V" "$FROM_V"
            printf 'The re-pin is prepared and pushed on branch `%s`, with registry `metadata.version` bumped to **%s**. `strict: true` preserved; no other member entry moves.\n\n' "$BRANCH" "$TO_REG"
            printf '**Open the pull request:** %s\n\n' "$COMPARE"
            printf '`validate-registry.mjs` passed against that exact tree inside the job. This workflow opens an issue rather than a pull request on purpose: creating one from Actions needs a repository setting that also lets any workflow APPROVE pull requests, and that would become a self-approval hole the day `main` gains a review requirement. Pushing a branch and asking for one click leaves review intact.\n\n'
            printf 'This automation does the noticing, not the deciding. A member can ship a release this registry deliberately skips.\n\n'
            printf '## Re-pin checklist (CONTRIBUTING.md Section 7)\n\n'
            printf -- '- [ ] The pinned `sha` sits on release tag v%s, and CI at that sha is green\n' "$TO_V"
            printf -- '- [ ] Versions agree: registry entry == release tag == library.json == plugin.json\n'
            printf -- '- [ ] The plugin repository CHANGELOG.md has the v%s entry\n' "$TO_V"
            printf -- '- [ ] Registry `metadata.version` bumped; entry added to this repository CHANGELOG.md\n'
            printf -- '- [ ] `strict: true` preserved; registry `validate` check green\n'
          } > issue-body.md
          gh issue create \
            --title "registry(${TO_REG}): re-pin ${NAME} to v${TO_V} (${TO_SHA:0:7})" \
            --body-file issue-body.md

      - name: Report
        if: ${{ always() }}
        run: |
          if [ "${{ steps.survey.outputs.code }}" = "0" ]; then
            echo "Every member is pinned at its latest release." >> "$GITHUB_STEP_SUMMARY"
          fi
